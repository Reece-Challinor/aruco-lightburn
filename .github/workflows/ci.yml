name: CI

# <!--
# <ai_agent_documentation>
#   <file_meta>
#     <name>ci.yml</name>
#     <type>github_actions_workflow</type>
#     <purpose>Quality gate: lint, tests, coverage, lockfile sync on PRs and main</purpose>
#   </file_meta>
# </ai_agent_documentation>
# -->

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0

      - name: Install dependencies (locked)
        run: uv sync --locked

      # Dependabot (uv ecosystem) updates pyproject + uv.lock but not the
      # exported requirements.txt; sync-requirements.yml regenerates it on
      # main after merge, so skip the drift gate on dependabot PRs only.
      - name: Check requirements.txt is in sync with uv.lock
        if: github.actor != 'dependabot[bot]'
        run: make check-requirements

      - name: Run validation suite
        run: make validate

      - name: Generate coverage report
        run: make coverage

      # Codecov v4 requires CODECOV_TOKEN (repo secret, from codecov.io).
      # Coverage is already enforced by `make coverage` (--cov-fail-under);
      # the upload is reporting only and must never block CI.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
