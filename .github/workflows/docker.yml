name: Docker Build

# <!--
# <ai_agent_documentation>
#   <file_meta>
#     <name>docker.yml</name>
#     <version>1.0.0</version>
#     <type>github_actions_workflow</type>
#     <purpose>Build and push Docker images on release tags</purpose>
#     <last_updated>2026-02-09</last_updated>
#     <maintainer>ArUCO Generator Team</maintainer>
#   </file_meta>
# </ai_agent_documentation>
# -->

# Manual-only: Docker is the optional self-host distribution path
# (deployment is Vercel-first). Run from the Actions tab when a Docker
# image is actually wanted; set DOCKER_USERNAME/DOCKER_PASSWORD secrets
# to publish to Docker Hub.
on:
  workflow_dispatch:

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # secrets are not allowed directly in `if:` expressions — expose
    # presence via job env instead. Docker Hub publishing is optional:
    # without DOCKER_USERNAME / DOCKER_PASSWORD secrets the image is
    # built (validated) but not pushed, and the workflow stays green.
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (no push — no Docker Hub credentials)
        if: env.HAS_DOCKERHUB != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aruco-generator:latest
            ${{ secrets.DOCKER_USERNAME }}/aruco-generator:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
