[project]
name = "aruco-generator"
version = "2.2.0"
description = "Professional ArUCO marker generator with calibration patterns and multi-format export"
requires-python = ">=3.11"

dependencies = [
    # Core Flask dependencies
    "flask>=3.1.1",
    "flask-sqlalchemy>=3.1.1",
    "werkzeug>=3.1.3",
    # Database
    "sqlalchemy>=2.0.41",
    "psycopg2-binary>=2.9.10",
    # Computer Vision
    "opencv-python-headless>=4.11.0.86",
    "numpy==1.26.4",
    # Export formats
    "pyyaml>=6.0.2",
    # Server
    "gunicorn>=23.0.0",
    "pytest",
    "flask-login",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-flask>=1.3.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aruco_generator*"]
