[project]
name = "aruco-generator"
version = "2.5.1"
description = "Professional ArUCO marker generator with calibration patterns and multi-format export"
requires-python = ">=3.11"

dependencies = [
    # Core Flask dependencies
    "flask>=3.1.1",
    "flask-sqlalchemy>=3.1.1",
    "werkzeug>=3.1.3",
    # Database
    "sqlalchemy>=2.0.41",
    "psycopg2-binary>=2.9.10",
    # Computer Vision
    "opencv-python-headless>=4.11.0.86",
    "numpy==1.26.4",
    # Export formats
    "pyyaml>=6.0.2",
    # Server
    "gunicorn>=23.0.0",
    "flask-login>=0.6.3",
    # Abuse protection
    "flask-limiter>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-flask>=1.3.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.8",
    "reportlab>=4.0.0",
    "mypy>=1.8.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aruco_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow or resource-intensive tests",
]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["aruco_generator", "app"]

[tool.coverage.report]
fail_under = 65
