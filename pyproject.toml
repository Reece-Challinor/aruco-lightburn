[project]
name = "aruco-generator"
version = "2.0.0"
description = "Professional ArUCO marker generator with calibration patterns, 3D coordinates, and multi-format export"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "flask-login>=0.6.3",
    "flask>=3.1.1",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "numpy==1.26.4",
    "opencv-python-headless>=4.11.0.86",
    "psycopg2-binary>=2.9.10",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.41",
    "werkzeug>=3.1.3",
    "psutil>=7.0.0",
    "marshmallow>=4.0.0",
    "flask-caching>=2.3.1",
    "celery>=5.5.3",
    "redis>=6.4.0",
    "prometheus-flask-exporter>=0.23.2",
    "flask-swagger-ui>=5.21.0",
    "flask-apispec>=0.11.4",
    "apispec>=6.8.2",
]
