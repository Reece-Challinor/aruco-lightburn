# Pre-commit configuration for ArUCO Generator v2.0.0
# Professional calibration pattern generator with coordinate systems

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix']
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.13

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=88', '--extend-ignore=E203,E501,W503']

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-ll, --skip=B101]  # Skip assert_used test
        files: ^aruco_generator/.*\.py$
        exclude: ^tests/

  - repo: local
    hooks:
      - id: validate-imports
        name: Validate Python imports
        entry: python3 -c "import sys; sys.exit(0)"
        language: system
        files: \.py$
        pass_filenames: false

      - id: check-generation-quality
        name: Check generation quality (no line artifacts)
        entry: python3 -m pytest tests/test_generation_quality.py::TestGenerationQuality::test_no_line_artifacts_in_single_marker -xvs
        language: system
        pass_filenames: false
        always_run: false
        files: ^aruco_generator/(aruco|drawing)\.py$

      # SVG overlap test removed - overlapping elements are acceptable for production use

      - id: check-export-consistency
        name: Check export format consistency
        entry: python3 -m pytest tests/test_export_formats.py::TestExportConsistency -xvs
        language: system
        pass_filenames: false
        always_run: false
        files: ^aruco_generator/(drawing|lightburn|web)\.py$

      - id: validate-marker-scaling
        name: Validate marker scaling preserves quality
        entry: python3 -m pytest tests/test_generation_quality.py::TestGenerationQuality::test_scaling_preserves_quality -xvs
        language: system
        pass_filenames: false
        always_run: false
        files: ^aruco_generator/aruco\.py$
